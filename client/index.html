<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jumpy Doodle</title>
    <link rel="icon" href="/default-assets/logo.svg" />
    <link rel="stylesheet" href="/styles/tailwind.css" />
    <style>
      :root {
        --bg-color: #f8f5e6;
        --grid-lines: #e3dcc3;
        --hud-text: #1f2937;
        --primary-color: #16a34a;
        --primary-text: #ffffff;
        --accent-color: #f59e0b;
        --overlay-color: rgba(0, 0, 0, 0.5);
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #1e293b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        overflow: hidden;
      }
      #game-wrapper {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        position: relative;
        width: 100%;
        max-width: 420px;
        aspect-ratio: 9 / 16;
        max-height: 100vh;
        overflow: hidden;
        background-color: var(--bg-color);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      }
      #game-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .pointer-events-auto {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-overlay"></div>
      </div>
    </div>
    <script type="module" src="/game/main.js"></script>
  </body>
</html>
