services:
  doodle-jump:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doodle-jump-service
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/doodle.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
